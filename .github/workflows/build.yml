name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write

env:
  SOLUTION: ConfKit.slnx
  DOTNET_NOLOGO: 1
  MYGET_APIKEY: ${{ secrets.MYGET_APIKEY }}
  NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
  IS_PUSH_DEFAULT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.filter.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - '*.sln'
              - '*.slnx'
              - .github/workflows/build.yml
              - build/pack.ps1
              - build/pkg.version
              - NuGet.Config
              - src/**
              - test/**

  build:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.should-build == 'true'

    needs:
      - changes

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Test Release
        run: dotnet test -c Release --no-restore ${{ env.SOLUTION }} -v q --property:WarningLevel=0 /clp:ErrorsOnly

      - name: Test Report
        uses: dorny/test-reporter@main
        if: (success() || failure())
        with:
          name: Test Report
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed

      - name: NuGet Publish
        if: ${{ env.IS_PUSH_DEFAULT == 'true' }}
        shell: pwsh
        run: |
          ./build/pack.ps1 -norestore $true

      - name: Set variables
        shell: pwsh
        run: |
          $ver = Get-Content -Path ./build/pkg.version
          echo "VERSION=$ver" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
          echo $ver

      - name: Create Tag
        if: ${{ env.IS_PUSH_DEFAULT == 'true' }}
        uses: huoshan12345/update-tag@v1
        with:
          tag_name: ${{ env.VERSION }}
          update_if_exists: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Create Release
        if: ${{ env.IS_PUSH_DEFAULT == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          token: ${{ secrets.PAT }}
          skipIfReleaseExists: true
          generateReleaseNotes: true

  build-result:
    if: always()
    runs-on: ubuntu-latest

    needs:
      - changes
      - build

    steps:
      - name: Check result
        shell: pwsh
        run: |
          $shouldBuild = "${{ needs.changes.outputs.should-build }}" -eq "true"

          $jobs = @(
            @{
              Name = "build"
              Result = "${{ needs.build.result }}"
              AllowSkipped = -not $shouldBuild
            },
            @{
              Name = "changes"
              Result = "${{ needs.changes.result }}"
              AllowSkipped = $false
            }
          )

          $invalidJobs = @()

          foreach ($job in $jobs) {
            Write-Host "$($job.Name): $($job.Result)"

            $isValid =
              $job.Result -eq "success" -or
              ($job.Result -eq "skipped" -and $job.AllowSkipped)

            if (-not $isValid) {
              $invalidJobs += $job
            }
          }

          if ($invalidJobs.Count -gt 0) {
            Write-Host "Invalid job results:"

            foreach ($job in $invalidJobs) {
              Write-Host "- $($job.Name): $($job.Result)"
            }

            exit 1
          }
...
